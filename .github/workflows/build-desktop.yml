name: build-desktop

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/build-desktop.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "packaging/**"
      - "scripts/bundle_macos.sh"
      - "scripts/release.sh"
      - "scripts/test_release_assets.sh"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: ZMark-macos
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: ZMark-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: ZMark-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Read package version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zmark_app/Cargo.toml | head -n1)
          test -n "$VERSION"
          echo "ZMARK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake nasm \
            libssl-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libvulkan-dev

      - name: Verify native filesystem safety
        shell: bash
        run: |
          cargo test -p zmark_core --lib -- --test-threads=1
          cargo test -p zmark_app --test app_state workspace_root_test:: -- --test-threads=1

      - name: Verify release asset preflight
        if: runner.os != 'Windows'
        run: bash scripts/test_release_assets.sh

      - name: Build release binary
        run: cargo build --release -p zmark_app

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle_macos.sh
          test -d target/bundle/ZMark.app
          ditto -c -k --sequesterRsrc --keepParent \
            target/bundle/ZMark.app "ZMark-${ZMARK_VERSION}-macos.zip"
          shasum -a 256 "ZMark-${ZMARK_VERSION}-macos.zip" > "ZMark-${ZMARK_VERSION}-macos.zip.sha256"

          mkdir -p dmg-stage
          ditto target/bundle/ZMark.app dmg-stage/ZMark.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "ZMark ${ZMARK_VERSION}" -srcfolder dmg-stage \
            -ov -format UDZO "ZMark-${ZMARK_VERSION}.dmg"
          shasum -a 256 "ZMark-${ZMARK_VERSION}.dmg" > "ZMark-${ZMARK_VERSION}.dmg.sha256"

      - name: Package Linux tarball and deb
        if: runner.os == 'Linux'
        run: |
          VERSION="$ZMARK_VERSION"
          ARCH=$(uname -m)
          PKG="ZMark-${VERSION}-linux-${ARCH}"
          mkdir -p "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp target/release/zmark_app "$PKG/usr/bin/zmark_app"
          cp assets/icon.iconset/icon_256x256.png \
             "$PKG/usr/share/icons/hicolor/256x256/apps/zmark.png"
          cat > "$PKG/usr/share/applications/zmark.desktop" <<'EOF'
          [Desktop Entry]
          Name=ZMark
          Comment=Markdown reader and editor
          Exec=zmark_app %F
          Icon=zmark
          Type=Application
          Categories=Office;TextEditor;
          MimeType=text/markdown;
          Terminal=false
          EOF
          mkdir -p "$PKG/DEBIAN"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: zmark
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: ZMark
          Description: ZMark Markdown reader and editor
           GPU-accelerated Markdown reader and editor built with Rust and GPUI.
          Depends: libc6, libgcc-s1, libstdc++6, libx11-6, libxcb1, libxkbcommon0, libwayland-client0, libvulkan1
          EOF
          dpkg-deb --build --root-owner-group "$PKG" \
            "ZMark-${VERSION}-linux-${ARCH}.deb"
          tar -czf "ZMark-${VERSION}-linux-${ARCH}.tar.gz" -C "$PKG" usr
          sha256sum ZMark-${VERSION}-linux-${ARCH}.* > SHA256SUMS-linux

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/zmark_app.exe package/ZMark.exe
          $zip = "ZMark-$($env:ZMARK_VERSION)-windows-x86_64.zip"
          Compress-Archive -Path package/* -DestinationPath $zip
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $zip" } |
            Set-Content "$zip.sha256"

          choco install nsis -y --no-progress
          $root = (Get-Location).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DVERSION=$($env:ZMARK_VERSION)" `
            "/DEXE_PATH=$root\target\release\zmark_app.exe" `
            "/DICON=$root\packaging\windows\zmark.ico" `
            "/DOUT_PATH=$root\ZMark-$($env:ZMARK_VERSION)-setup.exe" `
            "$root\packaging\windows\zmark.nsi"
          Get-FileHash "ZMark-$($env:ZMARK_VERSION)-setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ZMark-$($env:ZMARK_VERSION)-setup.exe" } |
            Set-Content "ZMark-$($env:ZMARK_VERSION)-setup.exe.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ZMark-*.zip
            ZMark-*.zip.sha256
            ZMark-*.dmg
            ZMark-*.dmg.sha256
            ZMark-*-setup.exe
            ZMark-*-setup.exe.sha256
            ZMark-*.tar.gz
            ZMark-*.deb
            SHA256SUMS-linux
          if-no-files-found: error
