<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>ZMark · 写下去，读得顺</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/gsap.min.js"></script>
</head>
<body>
  <main id="film" data-composition-id="zmark-promo" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="60">
    <section id="opening" class="scene clip" data-start="0" data-duration="5.5" data-track-index="0" aria-label="打开 ZMark">
      <div class="opening-rule"></div>
      <div class="opening-brand"><img src="assets/zmark.png" alt="">ZMark</div>
      <div class="opening-copy">
        <h1><span class="reveal"><span>写下去，</span></span><span class="reveal"><span>读得顺<span class="period">。</span></span></span></h1>
        <p>原生本地 Markdown 编辑器</p>
      </div>
      <div class="opening-art" aria-hidden="true">
        <div class="art-orbit"></div>
        <div class="paper draft">
          <div class="paper-rule"></div>
          <span class="draft-mark">#</span>
          <span>星图发布手记</span>
          <div class="draft-line"><i></i></div>
          <div class="draft-line short"></div>
          <div class="draft-line medium"></div>
        </div>
        <div class="paper proof">
          <div class="paper-rule"></div>
          <strong>星图<br>发布手记</strong>
          <div class="proof-line"></div><div class="proof-line short"></div>
        </div>
      </div>
    </section>

    <section id="split" class="scene clip" data-start="4.4" data-duration="11.5" data-track-index="1" aria-label="分屏同步滚动">
      <div class="feature-rule"></div>
      <div class="split-copy">
        <div class="eyebrow">分屏 · 同步滚动</div>
        <h2>边写，<br>边看<span class="period">。</span></h2>
        <p>左边写源码，右边看排版。<br>滚动一侧，两边跟着走。</p>
      </div>
      <div class="split-guide"><span></span></div>
      <div class="window">
        <img class="toolbar" src="assets/toolbar.png" alt="ZMark 分屏工具栏">
        <div class="panes">
          <div class="pane"><img class="pane-source" src="assets/source.webp" alt="Markdown 源码"></div>
          <div class="pane"><img class="pane-preview" src="assets/preview.webp" alt="实时排版预览"></div>
        </div>
        <div class="click-ring" aria-hidden="true"></div>
      </div>
    </section>

    <section id="lightbox" class="scene clip" data-start="14.5" data-duration="9.25" data-track-index="2" aria-label="原生 Mermaid 和高清灯箱">
      <div class="spotlight"></div>
      <div class="lightbox-copy">
        <div class="eyebrow">Mermaid · 高清灯箱</div>
        <h2>一张图，看清流程<span class="period">。</span></h2>
        <p>本机渲染，点开就能放大。</p>
      </div>
      <div class="lightbox-card">
        <img class="diagram" src="assets/diagram.webp" alt="起草、校对、修订和发布的 Mermaid 流程图">
      </div>
      <img class="lightbox-tools" src="assets/lightbox-tools.webp" alt="灯箱缩放控件">
    </section>

    <section id="closing" class="scene clip" data-start="22.65" data-duration="7.35" data-track-index="3" aria-label="下载 ZMark">
      <div class="closing-orbit" aria-hidden="true"></div>
      <div class="closing-orbit narrow" aria-hidden="true"></div>
      <div class="closing-lockup">
        <div class="closing-icon" aria-hidden="true"></div>
        <h2>ZMark</h2>
        <p>让 Markdown 写起来更顺手。</p>
      </div>
      <div class="closing-footer">
        <span>macOS · Windows · Linux</span>
        <span class="footer-rule"></span>
        <span>github.com/2716190547/zmark</span>
      </div>
    </section>

    <audio id="score" src="assets/score.m4a" data-start="0" data-duration="30" data-track-index="4" data-volume="1" preload="auto"></audio>
  </main>
  <script src="motion.js"></script>
</body>
</html>
