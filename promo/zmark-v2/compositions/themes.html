<template>
  <section class="shot" data-composition-id="themes" data-width="1280" data-height="720">
    <div class="stamp"><img src="assets/zmark-icon.png" alt="">ZMark</div>
    <h2 class="shot-copy">七套主题，<span>同一工作台。</span></h2>
    <div class="workbench" data-palette="default" style="--cut:50%"></div>
    <div class="theme-label" data-palette="default"><i></i><span>Default</span></div>
    <div class="rail"><b>浅色 / 深色 / 跟随系统</b><div class="theme-colors"></div></div>
    <div class="wipe"></div>
    <div class="brand-end" data-layout-allow-occlusion>
      <div class="wordmark">
        <img src="assets/zmark-icon.png" alt="">
        <div><h2>ZMark</h2><p>写作与预览，同步成稿。</p></div>
      </div>
      <div class="rail"><span>macOS · Windows · Linux</span><b>github.com/2716190547/zmark</b></div>
    </div>
  </section>
  <script>
    {
      const { scene, timeline: tl, find } = sceneTimeline('themes');
      const windowView = find('.workbench');
      buildWorkbench(windowView);
      find('.split-tool').classList.add('selected');
      find('.source-tool').classList.remove('selected');
      const palette = [
        ['claude', 'Claude Warm', true],
        ['macos', 'macOS Vibrant', false],
        ['tokyo-night', 'Tokyo Night', true],
        ['nord', 'Nord', true],
        ['github', 'GitHub Light', false],
        ['solarized', 'Solarized Light', false],
        ['one-dark', 'One Dark Pro', true]
      ];
      const label = find('.theme-label');
      find('.theme-colors').innerHTML = palette.map(([key, name]) =>
        `<span data-palette="${key}" title="${name}"></span>`).join('');
      const wipes = ['#d28b56', '#55a7ee', '#6d8df8', '#8ec1d5', '#3977dd', '#c5a359', '#6b8bb8'];
      const cover = find('.wipe');
      const end = find('.brand-end');

      tl.set(windowView.querySelectorAll('.pane-content'), { y: -325 }, 0)
        .set(cover, { scaleX: 0 }, 0)
        .set(end, { clipPath: 'inset(0 100% 0 0)', visibility: 'hidden' }, 0);
      palette.forEach(([key, name, dark], i) => {
        const beat = .5 + i * .5;
        tl.set(cover, { background: wipes[i] }, beat - .15)
          .fromTo(cover, { scaleX: 0, x: 0 }, { scaleX: 1, duration: .15, ease: 'power3.in' }, beat - .15)
          .set([windowView, label], { attr: { 'data-palette': key } }, beat)
          .set(scene, { className: dark ? 'shot night' : 'shot' }, beat)
          .set(label.querySelector('span'), { textContent: name }, beat)
          .to(cover, { x: 1280, duration: .19, ease: 'power4.out' }, beat);
      });
      tl.set(end, { visibility: 'visible' }, 5)
        .to(end, { clipPath: 'inset(0 0% 0 0)', duration: .54, ease: 'power3.inOut' }, 5)
        .set([windowView, label, find('.rail'), find('.stamp'), find('.shot-copy')], { visibility: 'hidden' }, 5.54)
        .fromTo(find('.wordmark'), { scale: .94 }, { scale: 1, duration: .67, ease: 'power4.out' }, 5.17);
    }
  </script>
</template>
