<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ZMark · 光速成稿</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/gsap.min.js"></script>
  <script src="workbench.js"></script>
</head>
<body>
<main id="film" data-composition-id="film" data-start="0" data-duration="35"
      data-width="1280" data-height="720" data-fps="60" data-motion-blur="on">
  <div class="clip scene" id="split" data-composition-id="split" data-composition-src="compositions/split.html"
       data-start="0" data-duration="12" data-track-index="1" data-width="1280" data-height="720"></div>
  <div class="clip scene" id="lightbox" data-composition-id="lightbox" data-composition-src="compositions/lightbox.html"
       data-start="12" data-duration="8" data-track-index="1" data-width="1280" data-height="720"></div>
  <div class="clip scene" id="workspace" data-composition-id="workspace" data-composition-src="compositions/workspace.html"
       data-start="20" data-duration="6" data-track-index="1" data-width="1280" data-height="720"></div>
  <div class="clip scene" id="themes" data-composition-id="themes" data-composition-src="compositions/themes.html"
       data-start="26" data-duration="9" data-track-index="1" data-width="1280" data-height="720"></div>
  <audio id="master" src="assets/audio/master.m4a" preload="auto"
         data-start="0" data-duration="35" data-track-index="2" data-volume="1"></audio>
</main>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines.film = gsap.timeline({ paused: true });
</script>
</body>
</html>
