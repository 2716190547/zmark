<template>
  <style>
    #split { position: absolute; inset: 0; }
  </style>
  <section id="split" class="stage studio" data-composition-id="split" data-width="1280" data-height="720">
    <div class="workbench" data-palette="default"></div>
    <div class="key" style="left:574px;top:640px"><span>⌘</span><span>2</span></div>
    <div class="cursor"></div>
  </section>
  <script>
    scene('split', ({ root, tl, find }) => {
      const win = find('.workbench');
      buildWorkbench(win, { dirty: true, mode: 'source', lines: 9, mermaid: false });
      const src = win.querySelector('.source .scroll');
      const pre = win.querySelector('.preview .scroll');
      const grow = win.querySelector('.code-grow');
      const card = win.querySelector('.mermaid-card');
      // Scroll targets are measured in the split layout the scrolls happen in.
      win.style.setProperty('--cut', '50%');
      const at = {};
      [[9, '.pv-v12'], [4, '.pv-v13'], [14, '.pv-limits']].forEach(([line, sel]) => { at[sel] = [sourceTop(root, line), previewTop(root, sel)]; });
      card.style.display = 'block';
      const r = stageRect(win.querySelector('.expand'), root);
      card.style.display = 'none';
      win.style.setProperty('--cut', '100%');
      const scrollTo = (line, sel, when, dur = 0.95) => tl
        .to(src, { y: -at[sel][0], duration: dur, ease: 'power2.inOut' }, when)
        .to(pre, { y: -at[sel][1], duration: dur, ease: 'power2.inOut' }, when);

      // ⌘2: the caret column opens into Source | Preview.
      pressKey(tl, find('.key'), 0.5, 0.7);
      tl.to(win, { '--cut': '50%', duration: 0.7, ease: 'expo.out' }, 0.52)
        .set(win.querySelector('.mode-source'), { className: 'mode-source' }, 0.52)
        .set(win.querySelector('.mode-split'), { className: 'mode-split selected' }, 0.52);

      // "左边写，右边同步排版": the rest of the notes land line by line on both sides.
      [9, 10, 11, 14, 15, 16, 18, 19].forEach((line, i) => revealLine(tl, root, line, 1.3 + i * 0.26));
      // "滚到哪里，两边就对到哪里".
      scrollTo(9, '.pv-v12', 3.6);
      scrollTo(4, '.pv-v13', 5.3, 0.85);

      // "写一段 Mermaid": the fence is typed at the end of the note.
      scrollTo(14, '.pv-limits', 7.2, 0.9);
      let t = typeLine(tl, root, 21, 8.0, 0.06);
      tl.set(grow, { display: 'block' }, t + 0.1);
      t = typeLine(tl, root, 22, t + 0.1, 0.04);
      const code = [];
      for (let line = 23; line <= 27; line += 1) {
        t = typeLine(tl, root, line, t + 0.08, 0.026);
        code.push(DOC[line][1]);
        TEXT.set(grow, esc(code.join('\n')), t);
      }
      t = typeLine(tl, root, 28, t + 0.1, 0.06);
      // "图就在本机画出来": the closed fence renders as a native diagram.
      tl.set(grow, { display: 'none' }, t + 0.12)
        .set(card, { display: 'block' }, t + 0.12)
        .fromTo(card, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'expo.out' }, t + 0.12);

      // The cursor comes in for the expand button.
      const cursor = find('.cursor');
      const btn = win.querySelector('.expand');
      const scrollY = at['.pv-limits'][1];
      tl.set(cursor, { x: 1320, y: 760 }, 0);
      click(tl, cursor, r.x + 6, r.y - scrollY + 8, 15.15, 1.2);
      tl.to(btn, { scale: 0.9, duration: 0.06 }, 15.15).to(btn, { scale: 1, duration: 0.12 }, 15.21);
    });
  </script>
</template>
