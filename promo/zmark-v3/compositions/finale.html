<template>
  <style>
    #finale { position: absolute; inset: 0; }
    #finale canvas.gl { z-index: 7; }
    #finale .lock { position: absolute; z-index: 8; left: 556px; top: 250px; color: #15171c; }
    #finale .lock h1 { margin: 0; font: 800 96px/1 "Promo Sans", sans-serif; letter-spacing: -4.5px; }
    #finale .lock .platforms { margin-top: 18px; font: 650 26px/1.2 "Promo Sans", sans-serif; color: #15171c; }
    #finale .cta { position: absolute; z-index: 8; left: 0; right: 0; top: 500px; display: flex; justify-content: center; align-items: center; gap: 12px; font: 600 28px/1 "Promo Mono", monospace; color: #15171c; }
    #finale .cta .icon { width: 22px; height: 22px; color: #d4572a; }
  </style>
  <section id="finale" class="stage studio" data-composition-id="finale" data-width="1280" data-height="720">
    <div class="workbench" data-palette="default"></div>
    <div class="key top"><span>⌘</span><span>3</span></div>
    <canvas class="gl" id="finale-gl" data-layout-ignore data-motion-blur="off"></canvas>
    <div class="lock" data-hold><h1>ZMark</h1><div class="platforms"><span>macOS</span> · <span>Windows</span> · <span>Linux</span></div></div>
    <div class="cta" data-hold><i class="icon" style="--icon:url(assets/icons/download.svg)"></i>github.com/2716190547/zmark/releases</div>
  </section>
  <script>
    (() => {
      // 44.0 s; the page bursts on the bar at 3.75 and the icon locks on the
      // music's last hit at 9.375 (53.375 s).
      const START = 44.0, END = 58.8, BURST = 3.75, LOCK = 9.375;
      scene('finale', ({ root, tl, find, all }) => {
        const win = find('.workbench');
        buildWorkbench(win, { title: 'release.md', mode: 'split', sidebar: true, late: true, saved: true });
        win.querySelector('.tree').style.display = 'none';
        win.querySelector('.outline').style.display = 'block';
        win.querySelector('.files-tab').classList.remove('selected');
        win.querySelector('.outline-tab').classList.add('selected');
        win.querySelector('.ol-v12').classList.add('active');
        const src = win.querySelector('.source .scroll');
        const pre = win.querySelector('.preview .scroll');
        const S0 = sourceTop(root, 9), P0 = previewTop(root, '.pv-v12');
        win.style.setProperty('--cut', '0%');
        const pane = win.querySelector('.preview');
        const bottom = Math.max(0, pre.scrollHeight + 40 - pane.offsetHeight);
        win.style.setProperty('--cut', '50%');
        tl.set(src, { y: -S0 }, 0).set(pre, { y: -P0 }, 0);

        // ⌘3: the page alone, read top to bottom.
        title(tl, root, '纯文本，读来像<em>成稿</em>', 0.3, 3.6);
        pressKey(tl, find('.key'), 0.45, 0.7);
        tl.to(win, { '--cut': '0%', duration: 0.6, ease: 'expo.out' }, 0.47)
          .set(win.querySelector('.mode-split'), { className: 'mode-split' }, 0.47)
          .set(win.querySelector('.mode-preview'), { className: 'mode-preview selected' }, 0.47)
          .to(pre, { y: 0, duration: 0.5, ease: 'power2.inOut' }, 0.47)
          .to(pre, { y: -bottom, duration: 2.6, ease: 'power1.inOut' }, 1.0)
          // The page breaks into the pieces of the film.
          .to(win, { scale: 1.03, opacity: 0, filter: 'blur(8px)', duration: 0.25, ease: 'power2.in' }, BURST - 0.05)
          .fromTo(find('.lock h1'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.45, ease: 'power3.out' }, LOCK + 0.85);
        all('.platforms span').forEach((el, i) => {
          tl.fromTo(el, { color: '#c9c5bd' }, { color: '#15171c', duration: 0.12 }, LOCK + 1.3 + i * 0.234);
        });
        tl.fromTo(find('.platforms'), { opacity: 0 }, { opacity: 1, duration: 0.15 }, LOCK + 1.2)
          .fromTo(find('.cta'), { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power3.out' }, LOCK + 2.1);
      });

      Stage3D.build('finale-gl', START, END, (THREE) => {
        const { RoundedBoxGeometry } = window.THREE_EXTRA;
        const { seg, lerp, ease, hash, glyph, lacquer, porcelain, labelTexture, BRAND } = Stage3D;
        const canvas = document.getElementById('finale-gl');
        const world = new THREE.Scene();
        const renderer = Stage3D.renderer(THREE, canvas, world);
        const camera = new THREE.PerspectiveCamera(30, 1280 / 720, 0.1, 100);
        Stage3D.studioLights(THREE, world, { key: 1.3, rim: 1.0 });
        const px = Stage3D.perPx(THREE, 30, 12);
        const at = (sx, sy) => new THREE.Vector3((sx - 640) * px, -(sy - 360) * px, 0);
        const target = at(640, 360);   // where pieces converge and the icon hits
        const lockup = at(450, 318);   // where it settles beside the wordmark

        // The icon: a white plate and the "Z", traced from assets/zmark-icon.png
        // (1024 px; plate 102–921, Z 262–761).
        const P = (x, y) => new THREE.Vector2((x - 512) / 820, -(y - 512) / 820);
        const shape = (pts) => new THREE.Shape(pts.map(([x, y]) => P(x, y)));
        const zOpts = { depth: 0.08, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.007, bevelSegments: 3 };
        const zMat = lacquer(THREE, 0xffffff, { map: Stage3D.brandTexture(THREE) });
        const half = (pts) => {
          const geo = new THREE.ExtrudeGeometry(shape(pts), zOpts);
          const uv = geo.attributes.uv, xy = geo.attributes.position;
          for (let i = 0; i < uv.count; i += 1) uv.setXY(i, (xy.getX(i) + 0.305) / 0.61, 1 - (0.305 - xy.getY(i)) / 0.61);
          return new THREE.Mesh(geo, zMat);
        };
        const upper = half([[262, 262], [761, 262], [574, 511], [262, 511]]);
        const lower = half([[449, 512], [761, 512], [761, 761], [262, 761]]);
        const plate = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 0.16, 6, 0.075), porcelain(THREE));
        upper.position.z = lower.position.z = 0.08;
        const icon = new THREE.Group();
        icon.add(plate, upper, lower);
        world.add(icon);
        const ICON = 150 * px, HIT = 320 * px;

        // The pieces of the film: Markdown marks, flowchart nodes, labels.
        const card = (text, w, face = '#ffffff', ink = '#15171c', border = face) => {
          const mat = lacquer(THREE, 0xffffff, { map: labelTexture(THREE, text, { w: Math.round(w * 160), h: 96, bg: face, ink, border, size: 54, weight: 650 }) });
          const side = lacquer(THREE, border === face ? 0xf2efe9 : 0x9370db);
          return new THREE.Mesh(new RoundedBoxGeometry(w, 0.6, 0.14, 3, 0.05), [side, side, side, side, mat, side]);
        };
        const items = [];
        const kinds = ['#', '*', '>', '-', '[]', '`'];
        const brand = BRAND.map((c) => lacquer(THREE, c));
        for (let i = 0; i < 34; i += 1) {
          const g = glyph(THREE, kinds[i % 6], i % 3 === 2 ? porcelain(THREE) : brand[i % 5]);
          g.scale.setScalar(0.2 + hash(i, 11) * 0.12);
          items.push(g);
        }
        ['写草稿', '校对', '打包构建', '发布'].forEach((t) => items.push(card(t, 1.5, '#f3f3ff', '#2c2c2c', '#9370db')));
        ['0.2.13', '0.2.12', 'macOS', 'Windows', 'Linux', 'release.md', '⌘N', '⌘2', '⌘S'].forEach((t) => items.push(card(t, t.length > 4 ? 1.9 : 1.2)));
        const pieces = items.map((obj, i) => {
          world.add(obj);
          const start = at(140 + hash(i, 1) * 1000, 170 + hash(i, 2) * 450);
          const dir = start.clone().sub(at(640, 392)).setZ(0).normalize();
          const burst = start.clone().add(dir.multiplyScalar(0.3 + hash(i, 3) * 0.8)).setZ(0.4 + hash(i, 4) * 1.8);
          return {
            obj, start, burst, base: obj.scale.x,
            spin: new THREE.Vector3(hash(i, 5) * 5 - 2.5, hash(i, 6) * 5 - 2.5, hash(i, 7) * 3 - 1.5),
            arrive: 6.0 + (i / items.length) * 2.5 + hash(i, 8) * 0.25, swirl: 1.4 + hash(i, 10) * 1.2,
          };
        });

        const p = new THREE.Vector3(), q = new THREE.Vector3();
        const draw = (t) => {
          canvas.style.opacity = t >= BURST ? '1' : '0';
          // Burst outward with a tumble, then spiral into the icon.
          pieces.forEach((o) => {
            const out = ease.out3(seg(t, BURST, BURST + 0.9));
            const home = ease.inOut2(seg(t, BURST + 0.5, o.arrive));
            p.copy(o.start).lerp(o.burst, out);
            const ang = o.swirl * home * Math.PI;
            q.copy(p).sub(target).applyAxisAngle(new THREE.Vector3(0, 0, 1), ang).multiplyScalar(1 - home).add(target);
            q.z = lerp(p.z, 0.2, home);
            o.obj.position.copy(q);
            const life = t - BURST;
            o.obj.rotation.set(o.spin.x * life * (1 - home * 0.5), o.spin.y * life, o.spin.z * life);
            const pop = ease.out4(seg(t, BURST, BURST + 0.25));
            // Pieces shrink into the icon as they reach it instead of piling on its face.
            o.obj.scale.setScalar(o.base * pop * (1 - ease.in2(seg(home, 0.62, 1))));
            o.obj.visible = t >= BURST && t < o.arrive;
          });
          // The icon grows from what it absorbs; the two halves of the Z lock on the hit.
          const grow = ease.out3(seg(t, BURST + 2.2, LOCK));
          const lock = ease.in3(seg(t, LOCK - 0.9, LOCK));
          icon.visible = t >= BURST + 2.2;
          const glide = ease.expoOut(seg(t, LOCK + 0.45, LOCK + 1.1));
          icon.position.copy(target).lerp(lockup, glide);
          const after = Math.max(0, t - LOCK);
          const punch = t >= LOCK ? 0.12 * Math.exp(-after * 7) * Math.cos(after * 22) : 0;
          icon.scale.setScalar(lerp(HIT * lerp(0.2, 1, grow), ICON, glide) * (1 + punch));
          icon.rotation.set(lerp(0.5, 0, grow), lerp(-1.1, 0, ease.inOut3(seg(t, BURST + 2.2, LOCK))), 0);
          upper.position.set(lerp(-0.32, 0, lock), lerp(0.18, 0, lock), 0.08 + lerp(0.25, 0, lock));
          lower.position.set(lerp(0.32, 0, lock), lerp(-0.18, 0, lock), 0.08 + lerp(0.25, 0, lock));
          // The camera swings 20° around the icon and settles frontal on the lock.
          const swing = ease.inOut3(seg(t, BURST + 0.4, BURST + 2.0)) * (1 - ease.inOut3(seg(t, BURST + 3.2, LOCK + 0.3)));
          const yaw = 0.34 * swing, pitch = 0.14 * swing, dist = 12 + 2.5 * swing;
          const orbit = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist).add(target);
          camera.position.set(0, 0, 12).lerp(orbit, swing);
          camera.lookAt(new THREE.Vector3(0, 0, 0).lerp(target, swing));
          // A highlight sweeps across the lacquer after the lock.
          world.environmentRotation.y = lerp(-1.4, 0.9, ease.inOut2(seg(t, LOCK - 0.2, LOCK + 1.4)));
          renderer.render(world, camera);
        };
        return renderer.compileAsync(world, camera).then(() => { draw(LOCK - 1); return draw; });
      });
    })();
  </script>
</template>
