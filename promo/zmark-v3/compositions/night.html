<template>
  <style>
    #night { position: absolute; inset: 0; }
  </style>
  <section id="night" class="stage night grain" data-composition-id="night" data-width="1280" data-height="720">
    <div class="clock">22:00</div>
    <div class="plain">
      <div class="plain-bar"><i></i><i></i><i></i><span>release.md</span></div>
      <div class="plain-body"><div class="plain-text"></div><div class="plain-caret"></div></div>
    </div>
    <div class="scrap" style="left:70px;top:300px">变更记录.txt<small>~/Downloads</small></div>
    <div class="scrap" style="left:1010px;top:150px">CI 日志<small>~/Desktop</small></div>
    <div class="scrap" style="left:1030px;top:470px">待办.md<small>~/Documents/notes</small></div>
    <div class="scrap" style="left:120px;top:540px">0.2.12 修复.md<small>~/工作区/zmark</small></div>
    <canvas class="gl" id="night-gl" style="z-index:5" data-layout-ignore data-motion-blur="off"></canvas>
  </section>
  <script>
    (() => {
      // Root-film seconds of this scene's slot.
      const START = 0, END = 14.4;
      const RAW = [
        '# ZMark 发布说明', '今晚发两个版本 先把要点写下来', '## 0.2.13', '- 安装包和自动更新迁回源码仓库',
        '- 关于页和欢迎页链接同步更新', '- 旧仓库归档 历史版本保留', '## 0.2.12', '- 草稿编辑后不再误报保存错误',
        '- 首次保存时再选位置', '## 已知限制', '- macOS 应用未经 Apple 公证', '- Windows 安装包未做代码签名',
        '## 下载', '- macOS · Windows · Linux', '## 发布流程', '```mermaid', 'flowchart LR', 'A[写草稿] --> B{校对}',
        'B -->|修改| A', 'B -->|通过| C[打包构建]', 'C --> D[发布]', '```',
      ];

      scene('night', ({ root, tl, find, all }) => {
        const text = find('.plain-text');
        const caret = find('.plain-caret');
        const scraps = all('.scrap');
        tl.fromTo(find('.plain'), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 2.6);
        // The caret blinks on a fixed 0.5 s grid while the page is empty.
        for (let t = 3.0; t < 5.6; t += 0.5) tl.set(caret, { opacity: Math.round((t - 3) / 0.5) % 2 ? 0 : 1 }, t);
        // 5.62: the falling "#" becomes the page's first character.
        TEXT.set(text, '#', 5.62);
        tl.set(caret, { opacity: 1, x: 14 }, 5.62);
        // Scattered notes arrive on "资料散在几个文件夹里".
        scraps.forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, x: (i % 2 ? 90 : -90), rotation: (i % 2 ? 8 : -7) },
            { opacity: 1, x: 0, rotation: (i % 2 ? 3 : -4), duration: 0.6, ease: 'power4.out' }, 7.0 + i * 0.32);
        });
        // "源码一长": the raw text floods the page and keeps scrolling.
        tl.set(caret, { opacity: 0 }, 8.7);
        RAW.forEach((_, i) => TEXT.set(text, esc(RAW.slice(0, i + 1).join('\n')), 8.7 + i * 0.09));
        tl.fromTo(text, { y: 0 }, { y: -560, duration: 3.4, ease: 'power1.in' }, 9.6)
          // "结构就看不清了": the structure dissolves.
          .to(text, { filter: 'blur(3px)', opacity: 0.55, duration: 0.8, ease: 'power2.inOut' }, 11.2)
          .to(scraps, { opacity: 0.25, filter: 'blur(2px)', duration: 0.8, ease: 'power2.inOut' }, 11.2)
          // "换个写法": everything clears for the reveal.
          .to([find('.clock'), ...scraps], { opacity: 0, filter: 'blur(8px)', duration: 0.3, ease: 'power2.in' }, 13.6)
          .to(find('.plain'), { scale: 0.94, opacity: 0.0, filter: 'blur(6px)', duration: 0.4, ease: 'power3.in' }, 14.0);
      });

      // The 3D "#": four paper bars, hovering, then dropping into the page.
      Stage3D.build('night-gl', START, END, (THREE) => {
        const { RoundedBoxGeometry } = window.THREE_EXTRA;
        const canvas = document.getElementById('night-gl');
        const renderer = Stage3D.renderer(THREE, canvas);
        const sceneGL = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 1280 / 720, 0.1, 100);
        camera.position.set(0, 0, 12);
        Stage3D.paperLights(THREE, sceneGL);
        const mat = new THREE.MeshStandardMaterial({ color: 0xe9a23b, roughness: 0.55, metalness: 0.0 });
        const edge = new THREE.MeshStandardMaterial({ color: 0xf3ead8, roughness: 0.6 });
        const glyph = new THREE.Group();
        const bar = (w, h, x, y, rz) => {
          const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, 0.42, 4, 0.08), [edge, edge, edge, edge, mat, mat]);
          m.position.set(x, y, 0); m.rotation.z = rz; glyph.add(m);
        };
        bar(0.34, 2.5, -0.42, 0, -0.16); bar(0.34, 2.5, 0.5, 0, -0.16);
        bar(2.3, 0.32, 0.06, 0.45, 0); bar(2.3, 0.32, -0.06, -0.45, 0);
        sceneGL.add(glyph);

        // Screen point of the page's first character, as world units on the z = 0 plane.
        const halfH = Math.tan(THREE.MathUtils.degToRad(15)) * 12;
        const halfW = halfH * 1280 / 720;
        const toWorld = (sx, sy) => [(sx / 1280 * 2 - 1) * halfW, -(sy / 720 * 2 - 1) * halfH];
        const [tx, ty] = toWorld(335, 263);
        const draw = (t) => {
          const { seg, lerp, ease } = Stage3D;
          const appear = ease.out4(seg(t, 0, 1.6));
          const settle = ease.inOut3(seg(t, 0.9, 4.4));
          const drop = ease.in3(seg(t, 4.75, 5.62));
          glyph.visible = t < 5.62;
          glyph.position.set(lerp(lerp(3.4, 2.1, settle), tx, drop), lerp(lerp(1.6, 0.7, settle), ty, drop), lerp(-1.5 * (1 - appear), 0, drop));
          glyph.rotation.set(lerp(0.55, 0.12, settle) * (1 - drop), lerp(-0.9, -0.28, settle) * (1 - drop), lerp(0.1, 0, settle));
          glyph.scale.setScalar(lerp(lerp(0.7, 1, appear), 0.072, drop));
          renderer.render(sceneGL, camera);
        };
        return renderer.compileAsync(sceneGL, camera).then(() => { draw(0); return draw; });
      });
    })();
  </script>
</template>
