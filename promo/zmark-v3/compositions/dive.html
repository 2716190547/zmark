<template>
  <style>
    #dive { position: absolute; inset: 0; }
    #dive .paper { position: absolute; z-index: 5; left: 0; top: 0; transform-origin: 0 0; padding: 20px; background: #ffffff; border: 1px solid #e6e4de; border-radius: 12px; }
    #dive .paper img { display: block; width: 100%; }
    #dive canvas.gl { z-index: 7; }
    #dive .light-tools, #dive .light-exit { z-index: 8; }
  </style>
  <section id="dive" class="stage studio" data-composition-id="dive" data-width="1280" data-height="720">
    <div class="workbench" data-palette="default"></div>
    <div class="light-shade"></div>
    <div class="paper" data-layout-allow-overflow data-motion-blur="off"><img src="assets/release-flow.svg" alt="发布流程图"></div>
    <div class="light-exit"></div>
    <div class="light-tools"></div>
    <canvas class="gl" id="dive-gl" data-layout-ignore data-motion-blur="off"></canvas>
  </section>
  <script>
    (() => {
      const START = 38.3, END = 44.4;
      // Diagram geometry from assets/release-flow.svg (viewBox 583 x 91.8).
      const VB = { w: 583, h: 91.8 };
      const NODES = [
        { id: 'A', label: '写草稿', x: 39.22, w: 78.44 },
        { id: 'B', label: '校对', x: 207.28, w: 95.76, diamond: true },
        { id: 'C', label: '打包构建', x: 383.08, w: 93.92 },
        { id: 'D', label: '发布', x: 511.52, w: 62.96 },
      ];
      const NODE_Y = 47.88, NODE_H = 32.8;
      // The SVG draws its graph inside <g transform="translate(20, 7.52)">.
      const OX = 20, OY = 7.52;
      // Lightbox fit: the diagram spans 1000 px of the 1280 px stage.
      const FIT = 1000 / VB.w;
      const paperAt = (zoom, cx) => {
        const s = FIT * zoom;
        return { x: 640 - ((cx + OX) * s + 20 * zoom), y: 360 - ((NODE_Y + OY) * s + 20 * zoom), scale: zoom };
      };

      scene('dive', ({ root, tl, find }) => {
        const win = find('.workbench');
        buildWorkbench(win, { dirty: true, mode: 'split' });
        const card = win.querySelector('.mermaid-card');
        const shift = previewTop(root, '.pv-limits');
        win.querySelector('.source .scroll').style.transform = `translateY(${-sourceTop(root, 14)}px)`;
        win.querySelector('.preview .scroll').style.transform = `translateY(${-shift}px)`;
        const r = stageRect(card, root);
        const paper = find('.paper');
        paper.style.width = (VB.w * FIT + 40) + 'px';
        const from = { x: r.x, y: r.y - shift, scale: r.w / (VB.w * FIT + 40) };
        const fit = paperAt(1, VB.w / 2);
        const tools = find('.light-tools');
        const exit = find('.light-exit');
        tools.innerHTML = icon('minus') + '<span class="zoom">100%</span>' + icon('maximize');
        exit.innerHTML = icon('x');
        const zoom = tools.querySelector('.zoom');

        TEXT.set(zoom, '200%', 1.6);
        TEXT.set(zoom, '300%', 4.47);
        // Click: the card opens into the Media Lightbox.
        tl.fromTo(find('.light-shade'), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power3.out' }, 0)
          .fromTo(paper, from, { ...fit, duration: 0.72, ease: 'expo.out' }, 0)
          .fromTo([tools, exit], { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.45)
          // "每一步都能放大细看".
          .to(paper, { ...paperAt(2, NODES[1].x), duration: 0.8, ease: 'power2.inOut' }, 1.2)
          // The 3D diagram takes over from the flat one.
          .set(paper, { opacity: 0 }, 2.2)
          // Landing at 300% on 发布, where the dive ends.
          .set(paper, { ...paperAt(3, NODES[3].x), opacity: 1, filter: 'blur(0px)' }, 4.78)
          .to([tools, exit], { opacity: 0, duration: 0.2 }, 5.45)
          .to(paper, { ...from, duration: 0.5, ease: 'power3.inOut' }, 5.45)
          .to(find('.light-shade'), { opacity: 0, duration: 0.45, ease: 'power2.in' }, 5.55)
          .to(paper, { opacity: 0, duration: 0.15 }, 5.9);
      });

      Stage3D.build('dive-gl', START, END, (THREE) => {
        const { RoundedBoxGeometry } = window.THREE_EXTRA;
        const { seg, lerp, ease, labelTexture } = Stage3D;
        const canvas = document.getElementById('dive-gl');
        const renderer = Stage3D.renderer(THREE, canvas);
        const world = new THREE.Scene();
        world.background = new THREE.Color(0x1a1b20);
        const camera = new THREE.PerspectiveCamera(30, 1280 / 720, 0.05, 200);
        Stage3D.paperLights(THREE, world, { shadow: true });
        // Fill from the camera's side so the faces turned toward it are not black.
        const fill = new THREE.DirectionalLight(0xfff1e0, 1.4);
        fill.position.set(-2, -6, 3);
        world.add(fill);
        const U = 40; // svg px per world unit
        // World origin is the centre of the node row; x/y are the SVG group's coordinates.
        const wx = (x) => (x + OX - VB.w / 2) / U;
        const wy = (y) => -(y - NODE_Y) / U;
        const PAD = 20 / FIT; // the lightbox paper's 20 px padding, in svg px

        // The lightbox's paper canvas, seen as a sheet the nodes stand on.
        // Unlit white so it matches the flat lightbox exactly; shadows sit on a layer above it.
        // The paper keeps the lightbox's 12 px corner radius.
        const sw = (VB.w + 2 * PAD) / U, sh = (VB.h + 2 * PAD) / U, rad = 12 / FIT / U;
        const outline = new THREE.Shape();
        outline.moveTo(-sw / 2 + rad, -sh / 2);
        outline.lineTo(sw / 2 - rad, -sh / 2); outline.quadraticCurveTo(sw / 2, -sh / 2, sw / 2, -sh / 2 + rad);
        outline.lineTo(sw / 2, sh / 2 - rad); outline.quadraticCurveTo(sw / 2, sh / 2, sw / 2 - rad, sh / 2);
        outline.lineTo(-sw / 2 + rad, sh / 2); outline.quadraticCurveTo(-sw / 2, sh / 2, -sw / 2, sh / 2 - rad);
        outline.lineTo(-sw / 2, -sh / 2 + rad); outline.quadraticCurveTo(-sw / 2, -sh / 2, -sw / 2 + rad, -sh / 2);
        const sheetGeo = new THREE.ShapeGeometry(outline, 8);
        const sheet = new THREE.Mesh(sheetGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }));
        sheet.position.set(0, (NODE_Y + OY - VB.h / 2) / U, 0);
        world.add(sheet);
        const shade = new THREE.Mesh(sheetGeo, new THREE.ShadowMaterial({ opacity: 0.22 }));
        shade.position.set(0, sheet.position.y, 0.002);
        shade.receiveShadow = true;
        world.add(shade);

        const side = new THREE.MeshStandardMaterial({ color: 0x9370db, roughness: 0.5 });
        const nodes = NODES.map((n) => {
          // Rect plus its 1.5 px stroke, square-cornered like the SVG.
          const w = (n.w + 1.5) / U, h = (NODE_H + 1.5) / U;
          // Faces are unlit so they keep the diagram's exact colours; the sides carry the light.
          const face = new THREE.MeshBasicMaterial({ map: labelTexture(THREE, n.label, { w: Math.round((n.diamond ? 50 : n.w) * 8), h: Math.round(NODE_H * 8), bg: '#f3f3ff', border: n.diamond ? '#f3f3ff' : '#9370db', size: 112 }), toneMapped: false });
          const group = new THREE.Group();
          let body;
          if (n.diamond) {
            const side2 = (95.76 / 2) * Math.SQRT2 / U;
            body = new THREE.Mesh(new RoundedBoxGeometry(side2, side2, 1, 3, 0.03), [side, side, side, side, new THREE.MeshBasicMaterial({ color: 0xf3f3ff, toneMapped: false }), side]);
            body.rotation.z = Math.PI / 4;
            const label = new THREE.Mesh(new THREE.PlaneGeometry(50 / U * 1.25, h * 1.25), face);
            label.position.z = 0.51;
            group.add(label);
          } else {
            body = new THREE.Mesh(new RoundedBoxGeometry(w, h, 1, 2, 0.004), [side, side, side, side, face, side]);
          }
          body.castShadow = true;
          group.add(body);
          group.position.set(wx(n.x), 0, 0);
          world.add(group);
          return group;
        });

        // Edges: A→B, B→C, C→D on the sheet, and the 修改 loop arching back to A.
        const ink = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
        const edge = (a, b) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(b - a, 0.035, 0.035), ink);
          m.position.set((a + b) / 2, 0, 0.05);
          world.add(m);
          // The SVG marker path M10 5 L0 10 L4 5 L0 0 Z, 1.2 svg px per unit, refX 8.
          const mk = (x, y) => new THREE.Vector2((x - 8) * 1.2 / U, -(y - 5) * 1.2 / U);
          const head = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([mk(10, 5), mk(0, 10), mk(4, 5), mk(0, 0)])), ink);
          head.position.set(b, 0, 0.05);
          world.add(head);
        };
        // A→B dips below the axis, B→A (修改) arches above it, as in the SVG.
        const curve = (a, c, b) => world.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, c, b), 40, 0.02, 8), ink));
        const v = (x, y) => new THREE.Vector3(wx(x), wy(y), 0.05);
        curve(v(78.44, 59.4), v(120.59, 70), v(166, 55));
        edge(wx(255.16), wx(336.12));
        edge(wx(430.04), wx(480.04));
        curve(v(169.42, 37.86), v(120.59, 26), v(78.44, 36.5));
        const tag = (text, x, y) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(34.54 / U * 1.2, 22.4 / U * 1.2), new THREE.MeshBasicMaterial({ map: labelTexture(THREE, text, { w: 276, h: 180, bg: '#f5f3ff', border: '#f5f3ff', ink: '#333333', size: 86 }), toneMapped: false }));
          m.position.set(x, y, 0.2);
          world.add(m);
          return m;
        };
        tag('修改', wx(118.92), wy(24.48));
        tag('通过', wx(295.64), 0);

        const A = wx(39.22), B = wx(207.28), D = wx(511.52);
        // Frontal distance that matches the flat lightbox at 200%: 3.43 px per svg px.
        const flat = 720 / (2 * Math.tan(THREE.MathUtils.degToRad(15)) * (FIT * 2 * U));
        const pos = new THREE.Vector3(), look = new THREE.Vector3();
        // flat * 2 / 3 is the frontal distance of the lightbox at 300%.
        const draw = (t) => {
          canvas.style.opacity = t >= 2.2 && t < 4.78 ? '1' : '0';
          // The nodes rise off the sheet.
          const rise = ease.inOut3(seg(t, 2.3, 3.0));
          const sink = ease.inOut3(seg(t, 4.2, 4.72));
          nodes.forEach((g, i) => {
            const k = ease.out3(seg(t, 2.3 + i * 0.08, 3.0 + i * 0.08)) * (1 - sink);
            g.scale.z = lerp(0.04, 0.55, k);
            g.position.z = g.scale.z / 2;
          });
          // Camera: frontal over 校对, down behind 写草稿, along the flow, into 发布.
          const low = ease.inOut3(seg(t, 2.3, 3.05));
          const travel = ease.inOut2(seg(t, 3.0, 4.2));
          const settle = ease.inOut3(seg(t, 4.2, 4.74));
          pos.set(lerp(lerp(B, A - 1.6, low), D - 2.3, travel), lerp(lerp(0, -3.0, low), -1.7, travel), lerp(lerp(flat, 3.0, low), 1.7, travel));
          look.set(lerp(lerp(B, A + 1.2, low), D, travel), 0, lerp(0, 0.3, low));
          pos.lerp(new THREE.Vector3(D, 0, flat * 2 / 3), settle);
          look.lerp(new THREE.Vector3(D, 0, 0), settle);
          camera.position.copy(pos);
          camera.up.set(0, 1, 0);
          camera.lookAt(look);
          renderer.render(world, camera);
          return rise;
        };
        return renderer.compileAsync(world, camera).then(() => { draw(2.3); return draw; });
      });
    })();
  </script>
</template>
