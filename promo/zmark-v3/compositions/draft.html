<template>
  <style>
    #draft { position: absolute; inset: 0; }
    #draft .flood { position: absolute; inset: 0; z-index: 7; background: #1c1d21; pointer-events: none; }
    #draft .welcome-line { color: var(--syntax-heading); font-weight: 700; }
  </style>
  <section id="draft" class="stage studio" data-composition-id="draft" data-width="1280" data-height="720">
    <div class="wordmark"><img src="assets/zmark-icon.png" alt=""><h1><span>Z</span><span>M</span><span>a</span><span>r</span><span>k</span></h1></div>
    <div class="workbench" data-palette="default"></div>
    <div class="key" style="left:574px;top:640px"><span>⌘</span><span>N</span></div>
    <div class="flood"></div>
  </section>
  <script>
    scene('draft', ({ root, tl, find, all }) => {
      const win = find('.workbench');
      buildWorkbench(win, { title: '欢迎使用 ZMark.md', lines: 0 });
      const label = win.querySelector('.file-label');
      const first = win.querySelector('.source [data-ln="0"]');
      const mark = find('.wordmark');

      const second = win.querySelector('.source [data-ln="2"]');
      first.innerHTML = '<span class="welcome-line"># 欢迎使用 ZMark</span>';
      second.textContent = '一款基于 Rust + GPUI 构建的原生本地 Markdown 编辑器。';
      // The night clears into the studio on "打开 ZMark".
      tl.fromTo(find('.flood'), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power2.out' }, 0)
        .fromTo(mark.querySelector('img'), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0);
      all('.wordmark h1 span').forEach((el, i) => {
        tl.fromTo(el, { opacity: 0.25, filter: 'blur(5px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power2.out' }, 0.22 + i * 0.1);
      });
      // The name lifts away and the window it names arrives.
      tl.set(mark, { opacity: 1 }, 0)
        .to(mark, { y: -70, opacity: 0, filter: 'blur(8px)', duration: 0.32, ease: 'power3.in' }, 1.95)
        .fromTo(win, { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: 'expo.out' }, 2.1);

      // ⌘N opens an untitled draft.
      pressKey(tl, find('.key'), 3.1, 0.8);
      TEXT.set(label, '未命名', 3.16);
      TEXT.set(second, '', 3.16);
      TEXT.set(first, '<span class="typing"></span>', 3.16);

      // "先写": the first lines go down fast; the title dims while unsaved.
      tl.set(label, { className: 'file-label dirty' }, 4.0);
      let t = typeLine(tl, root, 0, 4.0, 0.06);
      t = typeLine(tl, root, 2, t + 0.25, 0.045);
      t = typeLine(tl, root, 4, t + 0.25, 0.05);
      t = typeLine(tl, root, 5, t + 0.1, 0.03);
      t = typeLine(tl, root, 6, t + 0.05, 0.03);
      typeLine(tl, root, 7, t + 0.05, 0.03);
    });
  </script>
</template>
