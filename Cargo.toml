[workspace]
members = [
    "crates/zmark_core",
    "crates/zmark_app",
    "crates/release_tool",
]
resolver = "2"

# rusty-mermaid-diagrams 0.2.0 panics on non-ASCII input (it advances by one
# byte and slices keywords by byte length). The vendored copy advances by one
# char and slices with `get`; remove once upstream fixes it.
[patch.crates-io]
rusty-mermaid-diagrams = { path = "vendor/rusty-mermaid-diagrams" }

# Release binaries ship icons, a text renderer and a UI toolkit; keep them small.
[profile.release]
strip = true
lto = "thin"
codegen-units = 4
opt-level = "s"
