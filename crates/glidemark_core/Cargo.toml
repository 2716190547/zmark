[package]
name = "glidemark_core"
version = "0.1.0"
edition = "2021"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "8.0"
thiserror = "2.0"
dirs = "6.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[dev-dependencies]
tempfile = "3.17"
