[package]
name = "zmark_core"
version = "0.2.8"
edition = "2021"

[features]
test-observation = []

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "8.0"
thiserror = "2.0"
dirs = "6.0"
rusty-mermaid = { version = "0.2.0", features = ["svg"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tempfile = "3.17"
