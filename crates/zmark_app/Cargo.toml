[package]
name = "zmark_app"
version = "0.2.6"
edition = "2021"

[features]
test-observation = ["zmark_core/test-observation"]

[dependencies]
zmark_core = { path = "../zmark_core" }
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
gpui-component = { version = "=0.9.1", default-features = false }
gpui-kit-assets = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
usvg = "0.45.1"
percent-encoding = "2.3"
tempfile = "3.17"
ring = "0.17"
serde_json = "1.0"
hex = "0.4"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["font-kit", "test-support"] }
gpui-component = { version = "=0.9.1", default-features = false, features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit", "wayland", "x11", "runtime_shaders", "test-support"] }

[[test]]
name = "phase_h_b1_real_geometry"
path = "tests/phase_h_b1_real_geometry.rs"
required-features = ["test-observation"]

[[test]]
name = "phase_h_b2_highlight_matches_copy"
path = "tests/phase_h_b2_highlight_matches_copy.rs"
required-features = ["test-observation"]

[[test]]
name = "phase_h_b3_autoscroll_real_events"
path = "tests/phase_h_b3_autoscroll_real_events.rs"

[[test]]
name = "phase_h_b4_cmd_c_routing"
path = "tests/phase_h_b4_cmd_c_routing.rs"

[[test]]
name = "phase_i_syntax_and_warm_palette_test"
path = "tests/phase_i_syntax_and_warm_palette_test.rs"
required-features = ["test-observation"]

[[test]]
name = "rework4_stage_a_workspace_test"
path = "tests/rework4_stage_a_workspace_test.rs"
required-features = ["test-observation"]
