<svg xmlns="http://www.w3.org/2000/svg" width="680" height="148" viewBox="0 0 680 148">
  <defs>
    <clipPath id="heroClip">
      <rect x="2" y="2" width="676" height="144" rx="18"/>
    </clipPath>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF9F3"/>
      <stop offset="60%" stop-color="#F8F2E9"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C24128"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#heroClip)">
    <rect x="2" y="2" width="676" height="144" fill="url(#heroBg)"/>
    <!-- Subtle warm ambient glow behind ZMark emblem -->
    <circle cx="116" cy="74" r="68" fill="#F59E0B" opacity="0.10"/>
    <circle cx="628" cy="24" r="44" fill="#C24128" opacity="0.06"/>

    <!-- Official ZMark App Tile + Geometric Z Emblem (matching scripts/generate_icon.py) -->
    <rect x="34" y="29" width="90" height="90" rx="22" fill="#E8E1D5" opacity="0.55" transform="translate(0,3)"/>
    <rect x="34" y="29" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.4"/>
    <!-- Z glyph scaled cleanly into 50x50 inside 90x90 tile (top-left 54,49) -->
    <polygon points="54,49 104,49 85.25,74 54,74" fill="url(#zGrad)"/>
    <polygon points="72.75,74 104,74 104,99 54,99" fill="url(#zGrad)"/>

    <!-- Clean Split-View Schematic on Right -->
    <rect x="150" y="27" width="234" height="94" rx="11" fill="#FFFFFF" stroke="#E4DDD1" stroke-width="1.3"/>
    <rect x="166" y="42" width="14" height="7" rx="3" fill="#C24128"/>
    <rect x="186" y="42" width="112" height="7" rx="3.5" fill="#2D3138"/>
    <rect x="166" y="60" width="3.5" height="20" rx="1.75" fill="#E56B45"/>
    <rect x="176" y="62" width="150" height="5.5" rx="2.75" fill="#8C939E"/>
    <rect x="176" y="73" width="108" height="5.5" rx="2.75" fill="#B6BCC6"/>
    <rect x="166" y="92" width="76" height="14" rx="5" fill="#F6F1E9" stroke="#E6DFD3" stroke-width="1"/>
    <rect x="174" y="97" width="24" height="4" rx="2" fill="#C24128"/>
    <rect x="204" y="97" width="30" height="4" rx="2" fill="#2D8B83"/>
    <rect x="250" y="92" width="118" height="14" rx="5" fill="#F4F6F9"/>
    <rect x="258" y="97" width="66" height="4" rx="2" fill="#64748B"/>

    <!-- Smooth Connecting Arrow -->
    <line x1="394" y1="74" x2="412" y2="74" stroke="#D96B27" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M407 69 L413 74 L407 79" fill="none" stroke="#D96B27" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rendered Output Card -->
    <rect x="422" y="27" width="224" height="94" rx="11" fill="#FFFFFF" stroke="#E4DDD1" stroke-width="1.3"/>
    <rect x="438" y="41" width="132" height="8" rx="4" fill="#2D3138"/>
    <rect x="438" y="55" width="192" height="1.5" rx="0.75" fill="#EFEAE1"/>
    <rect x="438" y="65" width="90" height="40" rx="7" fill="#FAF5ED" stroke="#EADFCC" stroke-width="1"/>
    <polygon points="469,75 495,75 485.25,85 469,85" fill="url(#zGrad)"/>
    <polygon points="478.75,85 495,85 495,95 469,95" fill="url(#zGrad)"/>
    <rect x="538" y="65" width="92" height="17" rx="5" fill="#F1F8F5" stroke="#D1E7DD" stroke-width="1"/>
    <circle cx="549" cy="73.5" r="3.5" fill="#46A36E"/>
    <rect x="558" y="71.5" width="58" height="4" rx="2" fill="#2B6E4E"/>
    <rect x="538" y="88" width="92" height="17" rx="5" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="546" y="94.5" width="70" height="4" rx="2" fill="#6B7280"/>
  </g>
  <rect x="2" y="2" width="676" height="144" rx="18" fill="none" stroke="#E3DACB" stroke-width="1.4"/>
</svg>
